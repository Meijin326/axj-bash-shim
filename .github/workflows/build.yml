name: Build AXJBashShim

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: rootful
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/main.tar.gz -o /tmp/sdks.tar.gz \
            || curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -a /tmp/sdks-*/*.sdk "$THEOS/sdks/" || true
          ls -1 "$THEOS/sdks"

          if [ ! -x "$THEOS/bin/ldid" ]; then
            brew install ldid
            cp -a "$(which ldid)" "$THEOS/bin/ldid" || true
          fi
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1
          ls -lh packages/

      - name: Inspect deb
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          ls -lh packages/
          for f in packages/*.deb; do
            echo "== $f =="
            ar t "$f" || true
            echo "-- dylib/plist 成员 --"
            ar p "$f" data.tar.lzma > /tmp/d.tar.lzma 2>/dev/null || ar p "$f" data.tar.gz > /tmp/d.tar.gz
            if [ -f /tmp/d.tar.lzma ]; then tar tf /tmp/d.tar.lzma; else tar tzf /tmp/d.tar.gz; fi
            echo "-- 字符串自检（确认是我们的产物）--"
            if [ -f /tmp/d.tar.lzma ]; then tar xf /tmp/d.tar.lzma -C /tmp; else tar xzf /tmp/d.tar.gz -C /tmp; fi
            strings /tmp/Library/MobileSubstrate/DynamicLibraries/AXJBashShim.dylib 2>/dev/null | grep -i "bash\|DHPDaemon" | head -5 || true
            echo "-- plist 内容 --"
            cat /tmp/Library/MobileSubstrate/DynamicLibraries/AXJBashShim.plist 2>/dev/null || true
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: axj-bash-shim-rootful
          path: packages/*.deb
          if-no-files-found: error
